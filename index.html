<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بوابة الطلبات المالية</title>

  <link rel="icon" href="./src/images/ibtsmLogo.svg" type="image/svg+xml" />


  <link rel="stylesheet" href="./dist/output.css" />

  <script src="./node_modules/firebase/firebase-app-compat.js"></script>
  <script src="./node_modules/firebase/firebase-auth-compat.js"></script>
  <script src="./node_modules/firebase/firebase-firestore-compat.js"></script>

  <script src="./src/js/firebase-config.js"></script>

  <script defer src="./src/js/login.js"></script>

  <script defer src="./node_modules/alpinejs/dist/cdn.min.js"></script>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Noto+Nastaliq+Urdu:wght@400..700&family=Tajawal:wght@200;300;400;500;700;800;900&display=swap");

    body {
      font-family: "Tajawal", sans-serif;
    }

    [x-cloak] {
      display: none !important;
    }
  </style>
</head>

<body class="bg-[#F8FAFC] flex items-center justify-center min-h-screen p-4 sm:p-6 select-none">

  <div x-data="loginComponent" x-cloak
    class="w-full max-w-[480px] bg-white rounded-[24px] sm:rounded-[32px] shadow-[0_20px_50px_rgba(0,0,0,0.02)] border border-slate-100 p-6 sm:p-10 transition-all duration-300">

    <div class="text-center mb-6 sm:mb-8">
      <img src="./src/images/ibtsmLogo.png" alt="شعار جمعية ابتسم"
        class="w-auto h-20 sm:h-24 mx-auto object-contain mb-4 sm:mb-6" />

      <div
        class="inline-flex items-center justify-between gap-3 bg-[#F4F6F8] border border-slate-100 rounded-xl py-2.5 px-4 w-full max-w-[320px] mx-auto mb-4 sm:mb-1">
        <span class="text-sm sm:text-lg md:text-xl font-bold text-[#007B9D]">بوابة الطلبات المالية</span>
        <div
          class="w-8 h-8 sm:w-10 sm:h-10 bg-[#007B9D] rounded-lg flex items-center justify-center text-white shrink-0">
          <svg data-v-14650ad4="" class="text-white w-[1.621rem] h-[1.621rem]" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path data-v-14650ad4=""
              d="M9.19807 4.45825C8.55418 4.22291 7.94427 4 7 4C5 4 4 6 4 8.5C4 10.0985 4.40885 11.0838 4.83441 12.1093C5.0744 12.6877 5.31971 13.2788 5.5 14C5.649 14.596 5.7092 15.4584 5.77321 16.3755C5.92401 18.536 6.096 21 7.5 21C8.39898 21 8.79286 19.5857 9.22652 18.0286C9.75765 16.1214 10.3485 14 12 14C13.6515 14 14.2423 16.1214 14.7735 18.0286C15.2071 19.5857 15.601 21 16.5 21C17.904 21 18.076 18.536 18.2268 16.3755C18.2908 15.4584 18.351 14.596 18.5 14C18.6803 13.2788 18.9256 12.6877 19.1656 12.1093C19.5912 11.0838 20 10.0985 20 8.5C20 6 19 4 17 4C16.0557 4 15.4458 4.22291 14.8019 4.45825C14.082 4.72136 13.3197 5 12 5C10.6803 5 9.91796 4.72136 9.19807 4.45825Z">
            </path>
          </svg>
        </div>
      </div>

    </div>

    <div x-show="errorMessage" x-transition x-cloak
      class="mb-5 p-3.5 bg-red-50 border-r-4 border-red-500 rounded-xl flex items-start gap-2.5">
      <svg class="w-5 h-5 text-red-500 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      <p class="text-xs sm:text-sm text-red-700 font-medium leading-relaxed" x-text="errorMessage"></p>
    </div>

    <div class="mb-6">
      <div
        class="w-full bg-[#F4F6F8] border border-slate-200/60 rounded-xl p-3.5 flex items-center justify-between text-slate-500 font-medium">
        <div class="flex items-center">
          <svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206">
            </path>
          </svg>
          <span class="text-slate-400 text-sm sm:text-base">النطاق المعتمد</span>
        </div>
        <span dir="ltr" class="text-[#007B9D] font-bold text-sm md:text-base">
          @ibtsm.org.sa
        </span>
      </div>
    </div>

    <div class="space-y-4">
      <button @click="handleGoogleLogin()" :disabled="isLoading"
        class="w-full flex items-center justify-center gap-3 bg-[#8C9BB4] hover:bg-[#7A8A9E] active:scale-[0.98] text-white font-bold py-3.5 sm:py-4 px-4 rounded-xl shadow-sm transition-all duration-150 disabled:opacity-60 disabled:cursor-not-allowed text-sm sm:text-base cursor-pointer min-h-[52px] sm:min-h-[56px]">
        <svg x-show="!isLoading" class="w-4 h-4 sm:w-5 sm:h-5 fill-white shrink-0" viewBox="0 0 24 24">
          <path
            d="M12.24 10.285V14.4h6.887c-.275 1.565-1.88 4.604-6.887 4.604-4.33 0-7.866-3.577-7.866-8s3.536-8 7.866-8c2.46 0 4.105 1.025 5.047 1.926l3.227-3.11C18.416 1.838 15.542 1 12.24 1 5.92 1 1 5.92 1 12.24s4.92 11.24 11.24 11.24c6.6 0 11-4.62 11-11.24 0-.754-.078-1.33-.173-1.955H12.24z" />
        </svg>
        <svg x-show="isLoading" x-cloak class="animate-spin h-4 w-4 sm:h-5 sm:w-5 text-white shrink-0" fill="none"
          viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <circle class="opacity-75" fill="currentColor" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"
            stroke-dasharray="32" stroke-dashoffset="16"></circle>
        </svg>
        <span text-xs sm:text-sm
          x-text="isLoading ? 'جاري التحقق من الحساب...' : 'تسجيل الدخول عبر حساب Google'"></span>
      </button>
    </div>

    <div class="mt-8 text-center text-[10px] sm:text-xs text-slate-400 border-t border-slate-100 pt-4">
      نظام مخصص لموظفي جمعية ابتسم لخدمات طب الاسنان التطوعية
    </div>
  </div>
</body>

</html>
